name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build standalone executable
        run: npm run build:windows
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Resolve version from tag
        shell: pwsh
        id: version
        run: |
          # workflow_dispatch has no tag, so fall back rather than stamping a branch name.
          $ref = '${{ github.ref }}'
          if ($ref -like 'refs/tags/v*') { $version = $ref -replace '^refs/tags/v', '' }
          else { $version = '0.0.0-dev' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Installer AppVersion: $version"
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} installer\UnityHubRPC.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: UnityHubRPC-Windows
          path: release/UnityHubRPC-Setup.exe
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/UnityHubRPC-Setup.exe
